<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — NammaExam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#ffffff;--bg-alt:#f8f9fc;--bg-card:#ffffff;
            --text:#1a1a2e;--text-mid:#4a4a6a;--text-light:#8a8aa0;
            --primary:#d62828;--primary-light:#fef2f2;--primary-hover:#b91c1c;
            --accent:#1d4ed8;--accent-light:#eff6ff;
            --green:#16a34a;--green-light:#f0fdf4;
            --border:#e5e7eb;--border-light:#f3f4f6;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
            --shadow-md:0 4px 12px rgba(0,0,0,0.08);
            --radius:8px;--radius-lg:12px;
        }
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-alt);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
        a{text-decoration:none;color:inherit}

        .nav{background:var(--bg);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between}
        .nav-brand{font-weight:800;font-size:18px;color:var(--text);display:flex;align-items:center;gap:6px;cursor:pointer}
        .nav-brand em{font-style:normal;color:var(--primary)}
        .nav-right{display:flex;align-items:center;gap:8px}
        .lang-sw{display:flex;background:var(--bg-alt);border-radius:6px;padding:2px;border:1px solid var(--border)}
        .lang-sw button{border:none;background:transparent;padding:4px 10px;font-size:12px;font-weight:600;border-radius:4px;cursor:pointer;color:var(--text-light);transition:all .15s}
        .lang-sw button.on{background:var(--primary);color:#fff}

        .main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 24px;width:100%;max-width:400px;box-shadow:var(--shadow-sm)}

        .card-icon{width:44px;height:44px;border-radius:10px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px}
        .card h1{font-size:22px;font-weight:700;margin-bottom:4px}
        .card-sub{font-size:14px;color:var(--text-light);margin-bottom:24px}

        .fg{margin-bottom:16px}
        .fl{display:block;font-size:13px;font-weight:600;color:var(--text-mid);margin-bottom:5px}
        .fi{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);transition:all .15s;outline:none}
        .fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,0.08)}
        .fi::placeholder{color:var(--text-light)}
        .fi.err{border-color:var(--primary);background:var(--primary-light)}
        .ferr{font-size:12px;color:var(--primary);margin-top:3px;display:none}
        .ferr.show{display:block}

        .pw-wrap{position:relative}
        .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light);font-size:14px;padding:4px}
        .pw-toggle:hover{color:var(--text-mid)}

        .forgot{display:block;text-align:right;font-size:12px;color:var(--accent);font-weight:600;margin-top:4px;margin-bottom:20px}
        .forgot:hover{text-decoration:underline}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;width:100%}
        .btn:active{transform:scale(.97)}
        .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
        .btn-p{background:var(--accent);color:#fff}
        .btn-p:hover:not(:disabled){background:#1e40af}

        .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .link-row{text-align:center;font-size:13px;color:var(--text-mid);margin-top:20px}
        .link-row a{color:var(--primary);font-weight:600}
        .link-row a:hover{text-decoration:underline}

        .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;box-shadow:var(--shadow-md);display:none;max-width:360px;text-align:center}
        .toast.err{background:var(--primary);color:#fff}
        .toast.ok{background:var(--green);color:#fff}
        .toast.show{display:block}

        .pwb{text-align:center;padding:16px;font-size:12px;color:var(--text-light)}
        .pwb a{color:var(--primary);font-weight:700}

        @media(max-width:400px){.card{padding:24px 16px}}
    </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
    <div class="nav-brand" onclick="location.href='index.html'">Namma<em>Exam</em></div>
    <div class="nav-right">
        <div class="lang-sw">
            <button class="on" id="len" onclick="setL('en')">EN</button>
            <button id="lhi" onclick="setL('hi')">हिं</button>
        </div>
    </div>
</nav>

<!-- MAIN -->
<div class="main">
    <div class="card">
        <div class="card-icon">🔐</div>
        <h1 data-t="title">Welcome Back</h1>
        <p class="card-sub" data-t="subtitle">Login to continue practicing</p>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <!-- EMAIL -->
            <div class="fg">
                <label class="fl" data-t="l_email">Email Address</label>
                <input type="email" class="fi" id="email" placeholder="rahul@gmail.com" autocomplete="email" required>
                <div class="ferr" id="emailErr"></div>
            </div>

            <!-- PASSWORD -->
            <div class="fg">
                <label class="fl" data-t="l_pass">Password</label>
                <div class="pw-wrap">
                    <input type="password" class="fi" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" onclick="togglePw('password',this)">👁️</button>
                </div>
                <div class="ferr" id="passErr"></div>
            </div>

            <!-- FORGOT -->
            <a href="forgot-password.html" class="forgot" data-t="forgot">Forgot Password?</a>

            <!-- SUBMIT -->
            <button type="submit" class="btn btn-p" id="submitBtn" data-t="btn_login">Login</button>
        </form>

        <div class="link-row">
            <span data-t="no_account">New to NammaExam?</span>
            <a href="register.html" data-t="reg_link">Create Account</a>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- POWERED BY -->
<div class="pwb">
    Namma Exam — Powered by <a href="https://nammaexam.online/" target="_blank" rel="noopener">Clinisync Technology</a>
</div>

<script>
// ===== API URL =====
var API='https://script.google.com/macros/s/AKfycbxn_syphrTs7NP4QaVpOznYyds4ekTQlCjXxkX3uakfJHJmPKSiq83DVztoVeWpp8TVyg/exec';

// ===== LANGUAGE =====
var T={en:{title:"Welcome Back",subtitle:"Login to continue practicing",l_email:"Email Address",l_pass:"Password",forgot:"Forgot Password?",btn_login:"Login",no_account:"New to NammaExam?",reg_link:"Create Account",err_email:"Please enter a valid email",err_pass:"Please enter your password",err_wrong:"Wrong email or password",err_notfound:"This email is not registered",err_general:"Something went wrong. Please try again.",err_network:"Network error. Check your connection."},hi:{title:"वापस स्वागत है",subtitle:"अभ्यास जारी रखने के लिए लॉगिन करें",l_email:"ईमेल पता",l_pass:"पासवर्ड",forgot:"पासवर्ड भूल गए?",btn_login:"लॉगिन",no_account:"NammaExam पर नए हैं?",reg_link:"अकाउंट बनाएं",err_email:"कृपया सही ईमेल दर्ज करें",err_pass:"कृपया पासवर्ड दर्ज करें",err_wrong:"गलत ईमेल या पासवर्ड",err_notfound:"यह ईमेल रजिस्टर नहीं है",err_general:"कुछ गलत हुआ। फिर कोशिश करें।",err_network:"नेटवर्क त्रुटि। कनेक्शन जांचें।"}};
function getL(){return localStorage.getItem('nl')||'en'}
function setL(l){localStorage.setItem('nl',l);applyL(l);document.getElementById('len').classList.toggle('on',l==='en');document.getElementById('lhi').classList.toggle('on',l==='hi')}
function applyL(l){var t=T[l]||T.en;document.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');if(t[k])e.innerHTML=t[k]})}
applyL(getL());document.getElementById('len').classList.toggle('on',getL()==='en');document.getElementById('lhi').classList.toggle('on',getL()==='hi');

// Check if already logged in
if(localStorage.getItem('token')){location.href='dashboard.html'}

function togglePw(id,btn){var inp=document.getElementById(id);if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}else{inp.type='password';btn.textContent='👁️'}}

function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';setTimeout(function(){t.classList.remove('show')},4000)}

// ===== LOGIN =====
function handleLogin(e){
    e.preventDefault();
    var lang=getL(),t=T[lang],ok=true;
    document.querySelectorAll('.ferr').forEach(function(e){e.textContent='';e.classList.remove('show')});
    document.querySelectorAll('.fi').forEach(function(e){e.classList.remove('err')});

    var email=document.getElementById('email').value.trim();
    var pass=document.getElementById('password').value;

    if(!email||!email.includes('@')){document.getElementById('emailErr').textContent=t.err_email;document.getElementById('emailErr').classList.add('show');document.getElementById('email').classList.add('err');ok=false}
    if(!pass){document.getElementById('passErr').textContent=t.err_pass;document.getElementById('passErr').classList.add('show');document.getElementById('password').classList.add('err');ok=false}
    if(!ok)return false;

    var btn=document.getElementById('submitBtn');
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span> '+t.btn_login;

    fetch(API,{
        method:'POST',
        headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'login',email:email.toLowerCase(),password:pass})
    })
    .then(function(r){return r.json()})
    .then(function(res){
        btn.disabled=false;
        btn.textContent=t.btn_login;
        if(res.success){
            localStorage.setItem('token',res.token);
            localStorage.setItem('user',JSON.stringify(res.user));
            showToast(lang==='hi'?'लॉगिन हो गया!':'Logged in!','ok');
            setTimeout(function(){location.href='dashboard.html'},1000);
        } else {
            if(res.error&&res.error.indexOf('not found')!==-1){
                showToast(t.err_notfound,'err');
                document.getElementById('email').classList.add('err');
            } else {
                showToast(t.err_wrong,'err');
                document.getElementById('password').classList.add('err');
            }
        }
    })
    .catch(function(){
        btn.disabled=false;
        btn.textContent=t.btn_login;
        showToast(t.err_network,'err');
    });
    return false;
}
</script>
</body>
</html>
