<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — NammaExam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#ffffff;--bg-alt:#f8f9fc;--bg-card:#ffffff;
            --text:#1a1a2e;--text-mid:#4a4a6a;--text-light:#4a4a6a80;
            --primary:#d62828;--primary-light:#fef2f2;--primary-hover:#b91c1c;
            --accent:#1d4ed8;--accent-light:#eff6ff;
            --green:#16a34a;--green-light:#f0fdf4;
            --orange:#ea580c;--orange-light:#fff7ed;
            --purple:#7b2d8e;--purple-light:#f5e6fa;
            --border:#e5e7eb;--border-light:#f3f4f6;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
            --shadow-md:0 4px 12px rgba(0,0,0,0.08);
            --radius:8px;--radius-lg:12px;
        }
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-alt);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
        a{text-decoration:none;color:inherit}

        /* LOGIN GATE */
        .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .gate-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 24px;max-width:360px;width:100%;box-shadow:var(--shadow-md)}
        .gate-card h1{font-size:20px;font-weight:700;margin-bottom:4px}
        .gate-card p{font-size:13px;color:var(--text-mid);margin-bottom:20px}
        .fg{margin-bottom:14px}
        .fl{display:block;font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:4px}
        .fi{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;outline:none;transition:all .15s}
        .fi:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(214,40,40,0.08)}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;width:100%}
        .btn:active{transform:scale(.97)}
        .btn-p{background:var(--primary);color:#fff}
        .btn-p:hover{background:var(--primary-hover)}
        .btn-s{background:transparent;color:var(--text-mid);border:1.5px solid var(--border)}
        .btn-sm{padding:6px 14px;font-size:12px;width:auto}

        /* NAV */
        .nav{background:var(--bg);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .nav-brand{font-weight:800;font-size:18px;color:var(--text)}
        .nav-brand em{font-style:normal;color:var(--primary)}
        .nav-r{display:flex;align-items:center;gap:8px}

        /* PAGE */
        .page{max-width:960px;margin:0 auto;padding:20px 16px 60px}

        /* DATE BAR */
        .date-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
        .date-bar h1{font-size:20px;font-weight:700}
        .date-bar .last-upd{font-size:12px;color:var(--text-light)}

        /* STAT CARDS */
        .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
        .stat-val{font-size:26px;font-weight:800}
        .stat-lbl{font-size:11px;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px;margin-top:1px}
        .stat-change{font-size:11px;font-weight:600;margin-top:2px}
        .stat-change.up{color:var(--green)}
        .stat-change.down{color:var(--primary)}

        /* FUNNEL */
        .funnel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
        .funnel-title{font-size:14px;font-weight:700;margin-bottom:14px}
        .fn-step{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .fn-label{width:120px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0}
        .fn-bar-area{flex:1;height:24px;background:var(--border-light);border-radius:6px;overflow:hidden;position:relative}
        .fn-bar{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px}
        .fn-bar span{font-size:11px;font-weight:700;color:#fff}
        .fn-pct{width:45px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0;color:var(--text-mid)}

        /* TABLE */
        .tbl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px;overflow-x:auto}
        .tbl-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
        .tbl{width:100%;border-collapse:collapse;font-size:12px}
        .tbl th{text-align:left;padding:8px 10px;font-weight:600;color:var(--text-mid);border-bottom:1.5px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
        .tbl td{padding:8px 10px;border-bottom:1px solid var(--border-light);color:var(--text-mid)}
        .tbl tr:hover td{background:var(--bg-alt)}
        .tbl .amt{font-weight:700;color:var(--text)}
        .tbl .plan-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
        .tag-single{background:var(--accent-light);color:var(--accent)}
        .tag-ssc{background:var(--primary-light);color:var(--primary)}
        .tag-bank{background:var(--green-light);color:var(--green)}
        .tag-full{background:var(--orange-light);color:var(--orange)}
        .tag-rrb{background:var(--purple-light);color:var(--purple)}
        .tag-upsc{background:var(--orange-light);color:var(--orange)}
        .tag-free{background:var(--bg-alt);color:var(--text-light)}

        /* PAPER STATS */
        .paper-bars{display:flex;flex-direction:column;gap:6px}
        .pb-item{display:flex;align-items:center;gap:8px}
        .pb-name{width:140px;font-size:12px;font-weight:500;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .pb-bar-area{flex:1;height:16px;background:var(--border-light);border-radius:4px;overflow:hidden}
        .pb-bar{height:100%;border-radius:4px;background:var(--primary)}
        .pb-count{width:30px;font-size:11px;font-weight:600;flex-shrink:0}

        /* TOAST */
        .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;box-shadow:var(--shadow-md);display:none;max-width:360px;text-align:center}
        .toast.err{background:var(--primary);color:#fff}
        .toast.ok{background:var(--green);color:#fff}
        .toast.show{display:block}

        /* SPINNER */
        .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .ld-sp{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}

        /* POWERED BY */
        .pwb{text-align:center;padding:16px;font-size:12px;color:var(--text-light)}
        .pwb a{color:var(--primary);font-weight:700}

        @media(min-width:480px){.stat-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:640px){.stat-grid{grid-template-columns:repeat(6,1fr)}}
        @media(min-width:768px){.page{padding:28px 24px 60px}}
    </style>
</head>
<body>

<!-- ADMIN LOGIN GATE -->
<div class="gate" id="gateScreen">
    <div class="gate-card">
        <h1>Admin Access</h1>
        <p>Enter admin password</p>
        <div class="fg">
            <label class="fl">Password</label>
            <input type="password" class="fi" id="adminPass" placeholder="Enter password" onkeydown="if(event.key==='Enter')adminLogin()">
        </div>
        <button class="btn btn-p" onclick="adminLogin()">Access Dashboard</button>
    </div>
</div>

<!-- MAIN APP (hidden until logged in) -->
<div id="adminApp" style="display:none">

    <!-- NAV -->
    <nav class="nav">
        <div class="nav-brand">Namma<em>Exam</em> Admin</div>
        <div class="nav-r">
            <button class="btn btn-sm btn-s" onclick="refreshData()">Refresh</button>
            <button class="btn btn-sm btn-s" onclick="logoutAdmin()">Logout</button>
        </div>
    </nav>

    <!-- PAGE -->
    <div class="page">

        <!-- DATE BAR -->
        <div class="date-bar">
            <h1>Dashboard</h1>
            <span class="last-upd" id="lastUpd">Loading...</span>
        </div>

        <!-- STATS -->
        <div class="stat-grid" id="statGrid"></div>

        <!-- FUNNEL -->
        <div class="funnel" id="funnelArea"></div>

        <!-- RECENT PAYMENTS -->
        <div class="tbl-card" id="paymentsCard"></div>

        <!-- RECENT USERS -->
        <div class="tbl-card" id="usersCard"></div>

        <!-- PAPER POPULARITY -->
        <div class="tbl-card" id="paperCard"></div>

    </div>

    <!-- POWERED BY -->
    <div class="pwb">
        Namma Exam — Powered by <a href="https://nammaexam.online/" target="_blank" rel="noopener">Clinisync Technology</a>
    </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbxn_syphrTs7NP4QaVpOznYyds4ekTQlCjXxkX3uakfJHJmPKSiq83DVztoVeWpp8TVyg/exec';
var ADMIN_PASS='nammaexam2024'; // Change this!
var adminOk=false;

function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';setTimeout(function(){t.classList.remove('show')},3000)}

// ===== ADMIN LOGIN =====
function adminLogin(){
    var pass=document.getElementById('adminPass').value;
    if(pass===ADMIN_PASS){
        adminOk=true;
        sessionStorage.setItem('admin_ok','1');
        document.getElementById('gateScreen').style.display='none';
        document.getElementById('adminApp').style.display='block';
        loadData();
    } else {
        showToast('Wrong password','err');
    }
}

function logoutAdmin(){
    adminOk=false;
    sessionStorage.removeItem('admin_ok');
    document.getElementById('adminApp').style.display='none';
    document.getElementById('gateScreen').style.display='flex';
}

// Check session
if(sessionStorage.getItem('admin_ok')==='1'){
    adminOk=true;
    document.getElementById('gateScreen').style.display='none';
    document.getElementById('adminApp').style.display='block';
    loadData();
}

// ===== LOAD DATA =====
var adminData=null;

function loadData(){
    document.getElementById('lastUpd').innerHTML='<span class="ld-sp" style="width:16px;height:16px;display:inline-block;vertical-align:middle"></span> Loading...';
    fetch(API+'?action=adminStats&secret='+ADMIN_PASS)
    .then(function(r){return r.json()})
    .then(function(data){
        adminData=data;
        renderAll();
    })
    .catch(function(){
        showToast('Failed to load admin data','err');
        document.getElementById('lastUpd').textContent='Error loading';
    });
}

function refreshData(){loadData()}

function renderAll(){
    var d=adminData;
    document.getElementById('lastUpd').textContent='Updated: '+new Date().toLocaleTimeString();

    renderStats(d);
    renderFunnel(d);
    renderPayments(d.recentPayments||[]);
    renderUsers(d.recentUsers||[]);
    renderPaperStats(d.paperPopularity||{});
}

// ===== STATS =====
function renderStats(d){
    var stats=[
        {val:d.totalUsers||0,lbl:'Total Users',change:d.newUsersToday?'+ '+d.newUsersToday+' today':null,cls:'up'},
        {val:d.testsTaken||0,lbl:'Tests Taken',change:d.testsToday?'+ '+d.testsToday+' today':null,cls:'up'},
        {val:'₹'+(d.totalRevenue||0),lbl:'Revenue',change:d.revenueToday?'+ ₹'+d.revenueToday+' today':null,cls:'up'},
        {val:d.paidUsers||0,lbl:'Paid Users',change:null,cls:null},
        {val:(d.avgAccuracy||0)+'%',lbl:'Avg Accuracy',change:null,cls:null},
        {val:d.freeUsers||0,lbl:'Free Users',change:null,cls:null}
    ];
    var html='';
    stats.forEach(function(s){
        html+='<div class="stat-card"><div class="stat-val">'+s.val+'</div><div class="stat-lbl">'+s.lbl+'</div>';
        if(s.change)html+='<div class="stat-change '+s.cls+'">'+s.change+'</div>';
        html+='</div>';
    });
    document.getElementById('statGrid').innerHTML=html;
}

// ===== FUNNEL =====
function renderFunnel(d){
    var freeStarted=d.freeTestStarted||0;
    var freeCompleted=d.freeTestCompleted||0;
    var clickedUnlock=d.clickedUnlock||0;
    var paid=d.paidUsers||0;

    var steps=[
        {label:'Free Started',count:freeStarted,color:'var(--accent)'},
        {label:'Free Completed',count:freeCompleted,color:'var(--green)'},
        {label:'Clicked Unlock',count:clickedUnlock,color:'var(--orange)'},
        {label:'Paid',count:paid,color:'var(--primary)'}
    ];

    var maxCount=freeStarted||1;
    var html='<div class="funnel-title">Conversion Funnel</div>';
    steps.forEach(function(s,i){
        var pct=Math.round(s.count/maxCount*100);
        var width=Math.max(Math.round(s.count/maxCount*100),2);
        html+=
            '<div class="fn-step">'+
                '<span class="fn-label">'+s.label+'</span>'+
                '<div class="fn-bar-area"><div class="fn-bar" style="width:'+width+'%;background:'+s.color+'"><span>'+s.count+'</span></div></div>'+
                '<span class="fn-pct">'+pct+'%</span>'+
            '</div>';
    });

    if(paid>0&&freeStarted>0){
        var conv=Math.round(paid/freeStarted*100);
        html+='<div style="margin-top:12px;font-size:13px;font-weight:700;color:var(--primary)">Overall Conversion: '+conv+'%</div>';
    }

    document.getElementById('funnelArea').innerHTML=html;
}

// ===== PAYMENTS TABLE =====
function renderPayments(payments){
    var html='<div class="tbl-title">Recent Payments</div>';
    if(payments.length===0){
        html+='<p style="font-size:13px;color:var(--text-light)">No payments yet</p>';
    } else {
        html+='<table class="tbl"><thead><tr><th>Date</th><th>User</th><th>Plan</th><th>Amount</th><th>Status</th></tr></thead><tbody>';
        payments.slice(0,20).forEach(function(p){
            var tagCls='tag-'+(p.planId||'free').replace('-pack','');
            html+=
                '<tr>'+
                    '<td>'+(p.date||'')+'</td>'+
                    '<td>'+(p.email||p.userId||'')+'</td>'+
                    '<td><span class="plan-tag '+tagCls+'">'+(p.planId||'')+'</span></td>'+
                    '<td class="amt">₹'+(p.amount||0)+'</td>'+
                    '<td>'+(p.status||'')+'</td>'+
                '</tr>';
        });
        html+='</tbody></table>';
    }
    document.getElementById('paymentsCard').innerHTML=html;
}

// ===== USERS TABLE =====
function renderUsers(users){
    var html='<div class="tbl-title">Recent Users</div>';
    if(users.length===0){
        html+='<p style="font-size:13px;color:var(--text-light)">No users yet</p>';
    } else {
        html+='<table class="tbl"><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Plan</th><th>Tests</th></tr></thead><tbody>';
        users.slice(0,20).forEach(function(u){
            var tagCls='tag-'+(u.plan||'free').replace('-pack','');
            html+=
                '<tr>'+
                    '<td>'+(u.date||'')+'</td>'+
                    '<td>'+(u.name||'')+'</td>'+
                    '<td>'+(u.email||'')+'</td>'+
                    '<td><span class="plan-tag '+tagCls+'">'+(u.plan||'free')+'</span></td>'+
                    '<td>'+(u.testsTaken||0)+'</td>'+
                '</tr>';
        });
        html+='</tbody></table>';
    }
    document.getElementById('usersCard').innerHTML=html;
}

// ===== PAPER POPULARITY =====
function renderPaperStats(papers){
    var keys=Object.keys(papers);
    var html='<div class="tbl-title">Paper Popularity</div>';
    if(keys.length===0){
        html+='<p style="font-size:13px;color:var(--text-light)">No test data yet</p>';
    } else {
        var sorted=keys.map(function(k){return{name:k,count:papers[k]}}).sort(function(a,b){return b.count-a.count});
        var maxC=sorted[0].count||1;
        html+='<div class="paper-bars">';
        sorted.slice(0,15).forEach(function(p){
            var w=Math.round(p.count/maxC*100);
            html+=
                '<div class="pb-item">'+
                    '<span class="pb-name">'+p.name+'</span>'+
                    '<div class="pb-bar-area"><div class="pb-bar" style="width:'+w+'%"></div></div>'+
                    '<span class="pb-count">'+p.count+'</span>'+
                '</div>';
        });
        html+='</div>';
    }
    document.getElementById('paperCard').innerHTML=html;
}
</script>
</body>
</html>
