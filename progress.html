<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Progress — NammaExam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#ffffff;--bg-alt:#f8f9fc;--bg-card:#ffffff;
            --text:#1a1a2e;--text-mid:#4a4a6a;--text-light:#8a8aa0;
            --primary:#d62828;--primary-light:#fef2f2;--primary-hover:#b91c1c;
            --accent:#1d4ed8;--accent-light:#eff6ff;
            --green:#16a34a;--green-light:#f0fdf4;
            --orange:#ea580c;--orange-light:#fff7ed;
            --border:#e5e7eb;--border-light:#f3f4f6;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
            --shadow-md:0 4px 12px rgba(0,0,0,0.08);
            --radius:8px;--radius-lg:12px;
        }
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-alt);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
        a{text-decoration:none;color:inherit}

        /* NAV */
        .nav{background:var(--bg);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .nav-l{display:flex;align-items:center;gap:10px}
        .back-btn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-mid);padding:4px}
        .back-btn:hover{color:var(--text)}
        .nav-brand{font-weight:800;font-size:18px;color:var(--text)}
        .nav-brand em{font-style:normal;color:var(--primary)}
        .nav-r{display:flex;align-items:center;gap:8px}
        .lang-sw{display:flex;background:var(--bg-alt);border-radius:6px;padding:2px;border:1px solid var(--border)}
        .lang-sw button{border:none;background:transparent;padding:4px 10px;font-size:12px;font-weight:600;border-radius:4px;cursor:pointer;color:var(--text-light);transition:all .15s}
        .lang-sw button.on{background:var(--primary);color:#fff}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
        .btn:active{transform:scale(.97)}
        .btn-p{background:var(--primary);color:#fff}
        .btn-p:hover{background:var(--primary-hover)}
        .btn-s{background:transparent;color:var(--text-mid);border:1.5px solid var(--border)}

        /* PAGE */
        .page{max-width:720px;margin:0 auto;padding:20px 16px 60px}

        /* HEADER */
        .pg-head{margin-bottom:24px}
        .pg-head h1{font-size:22px;font-weight:700}
        .pg-head p{font-size:13px;color:var(--text-light);margin-top:2px}

        /* STAT CARDS */
        .stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
        .stat-val{font-size:28px;font-weight:800}
        .stat-lbl{font-size:11px;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
        .stat-sub{font-size:10px;color:var(--green);font-weight:600;margin-top:1px}

        /* STREAK */
        .streak-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:24px}
        .streak-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
        .streak-row{display:flex;gap:6px;justify-content:center}
        .streak-day{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-direction:column;gap:1px}
        .streak-day .day-lbl{font-size:9px;font-weight:500}
        .streak-done{background:var(--green-light);color:var(--green);border:1px solid var(--green)}
        .streak-today{background:var(--primary-light);color:var(--primary);border:1px solid var(--primary)}
        .streak-miss{background:var(--bg-alt);color:var(--text-light);border:1px solid var(--border-light)}

        /* SECTION TITLE */
        .sec-t{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
        .sec-t small{font-size:12px;font-weight:600;color:var(--primary);cursor:pointer}

        /* TREND CHART */
        .trend-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
        .trend-wrap{position:relative;height:160px;margin-top:8px}
        .trend-svg{width:100%;height:100%}

        /* TOPIC HEATMAP */
        .topic-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
        .topic-list{display:flex;flex-direction:column;gap:6px}
        .topic-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);background:var(--bg)}
        .topic-rank{width:20px;font-size:11px;font-weight:700;color:var(--text-light);text-align:center;flex-shrink:0}
        .topic-info{flex:1;min-width:0}
        .topic-name{font-size:13px;font-weight:600}
        .topic-sec{font-size:11px;color:var(--text-light)}
        .topic-bar-area{width:80px;flex-shrink:0}
        .topic-bar{height:6px;background:var(--border-light);border-radius:3px;overflow:hidden}
        .topic-fill{height:100%;border-radius:3px}
        .topic-pct{font-size:12px;font-weight:700;width:36px;text-align:right;flex-shrink:0}
        .topic-tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;flex-shrink:0}
        .tag-strong{background:var(--green-light);color:var(--green)}
        .tag-avg{background:var(--orange-light);color:var(--orange)}
        .tag-weak{background:var(--primary-light);color:var(--primary)}

        /* EXAM SUMMARY */
        .exam-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
        .exam-row{display:flex;flex-direction:column;gap:8px}
        .exam-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border-light);border-radius:var(--radius);cursor:pointer;transition:all .12s}
        .exam-item:hover{border-color:var(--primary)}
        .exam-left{display:flex;align-items:center;gap:8px}
        .exam-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .exam-nm{font-size:13px;font-weight:600}
        .exam-ct{font-size:11px;color:var(--text-light)}
        .exam-right{text-align:right}
        .exam-sc{font-size:14px;font-weight:700}
        .exam-best{font-size:11px;color:var(--text-light)}
        .exam-empty{text-align:center;padding:20px;font-size:13px;color:var(--text-light)}

        /* HISTORY */
        .hist-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
        .hist-list{display:flex;flex-direction:column;gap:6px}
        .hist-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border-light);border-radius:var(--radius);cursor:pointer;transition:all .12s}
        .hist-item:hover{border-color:var(--primary)}
        .hist-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
        .hist-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
        .hist-info{flex:1;min-width:0}
        .hist-exam{font-size:12px;font-weight:600}
        .hist-paper{font-size:11px;color:var(--text-light)}
        .hist-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
        .hist-score{font-size:13px;font-weight:700}
        .hist-date{font-size:11px;color:var(--text-light)}
        .hist-empty{text-align:center;padding:20px;font-size:13px;color:var(--text-light)}

        /* LOADING */
        .loading{display:flex;align-items:center;justify-content:center;padding:80px 0;flex-direction:column;gap:12px}
        .ld-sp{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loading p{font-size:13px;color:var(--text-light)}

        /* POWERED BY */
        .pwb{text-align:center;padding:16px;font-size:12px;color:var(--text-light)}
        .pwb a{color:var(--primary);font-weight:700}

        @media(min-width:480px){.stat-row{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:640px){.page{padding:28px 24px 60px}.pg-head h1{font-size:26px}}
    </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
    <div class="nav-l">
        <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
        <div class="nav-brand">Namma<em>Exam</em></div>
    </div>
    <div class="nav-r">
        <div class="lang-sw">
            <button class="on" id="len" onclick="setL('en')">EN</button>
            <button id="lhi" onclick="setL('hi')">हिं</button>
        </div>
    </div>
</nav>

<!-- LOADING -->
<div class="loading" id="loadingState">
    <div class="ld-sp"></div>
    <p>Loading progress...</p>
</div>

<!-- PAGE -->
<div class="page" id="pageContent" style="display:none">

    <!-- HEADER -->
    <div class="pg-head">
        <h1 id="pgTitle">My Progress</h1>
        <p id="pgSub">Track your preparation journey</p>
    </div>

    <!-- STATS -->
    <div class="stat-row" id="statRow"></div>

    <!-- STREAK -->
    <div class="streak-card" id="streakCard"></div>

    <!-- TREND -->
    <div class="trend-card" id="trendCard"></div>

    <!-- TOPIC HEATMAP -->
    <div class="topic-card" id="topicCard"></div>

    <!-- EXAM SUMMARY -->
    <div class="exam-card" id="examCard"></div>

    <!-- HISTORY -->
    <div class="hist-card" id="histCard"></div>

</div>

<!-- POWERED BY -->
<div class="pwb" id="pwb" style="display:none">
    Namma Exam — Powered by <a href="https://nammaexam.online/" target="_blank" rel="noopener">Clinisync Technology</a>
</div>

<script>
var API='https://script.google.com/macros/s/AKfycbxn_syphrTs7NP4QaVpOznYyds4ekTQlCjXxkX3uakfJHJmPKSiq83DVztoVeWpp8TVyg/exec';
var token=localStorage.getItem('token');
var user=JSON.parse(localStorage.getItem('user')||'{}');
if(!token)location.href='login.html';

var dashData=null;

// ===== LANGUAGE =====
var TL={en:{title:"My Progress",sub:"Track your preparation journey",tests:"Tests Taken",avg:"Avg Score",best:"Best Score",time:"Total Time",streak:"Study Streak",trend:"Score Trend",trend_sub:"Performance across tests",topics:"Topic-wise Accuracy",topics_sub:"Focus on weak areas",focus:"Focus Areas",exams:"Exam-wise Summary",history:"Attempt History",no_data:"No tests taken yet",no_topics:"Complete tests to see topic analysis",no_exams:"No exams attempted",no_hist:"No attempt history",start:"Start Practicing",day_names:["M","T","W","T","F","S","S"]},hi:{title:"मेरी प्रगति",sub:"अपनी तैयारी की यात्रा ट्रैक करें",tests:"टेस्ट दिए",avg:"औसत स्कोर",best:"सर्वश्रेष्ठ",time:"कुल समय",streak:"अभ्यास श्रृंखला",trend:"स्कोर ट्रेंड",trend_sub:"टेस्ट में प्रदर्शन",topics:"विषयवार सटीकता",topics_sub:"कमजोर क्षेत्रों पर ध्यान दें",focus:"फोकस क्षेत्र",exams:"परीक्षावार सारांश",history:"प्रयास इतिहास",no_data:"अभी तक कोई टेस्ट नहीं",no_topics:"विषय विश्लेषण के लिए टेस्ट पूरा करें",no_exams:"कोई परीक्षा नहीं दी",no_hist:"कोई इतिहास नहीं",start:"अभ्यास शुरू करें",day_names:["सो","मं","बु","गु","शु","श","र"]}};
function getL(){return localStorage.getItem('nl')||'en'}
function setL(l){localStorage.setItem('nl',l);applyL(l);document.getElementById('len').classList.toggle('on',l==='en');document.getElementById('lhi').classList.toggle('on',l==='hi');if(dashData)renderAll()}
function applyL(l){var t=TL[l]||TL.en;document.getElementById('pgTitle').textContent=t.title;document.getElementById('pgSub').textContent=t.sub}
applyL(getL());document.getElementById('len').classList.toggle('on',getL()==='en');document.getElementById('lhi').classList.toggle('on',getL()==='hi');

// ===== LOAD =====
function loadData(){
    fetch(API+'?action=getDashboard&token='+encodeURIComponent(token))
    .then(function(r){return r.json()})
    .then(function(data){
        if(data.error&&data.code===401){location.href='login.html';return}
        dashData=data;
        localStorage.setItem('dash_cache',JSON.stringify(data));
        renderAll();
    })
    .catch(function(){
        var cached=JSON.parse(localStorage.getItem('dash_cache')||'null');
        if(cached){dashData=cached;renderAll()}
        else{document.getElementById('loadingState').innerHTML='<p style="color:var(--primary)">Failed to load. <a href="#" onclick="loadData();return false">Retry</a></p>'}
    });
}

function renderAll(){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('pageContent').style.display='block';
    document.getElementById('pwb').style.display='block';

    var lang=getL(),t=TL[lang]||TL.en;
    var stats=dashData.stats||{};
    var results=dashData.recentResults||[];

    renderStats(stats,t);
    renderStreak(stats,t);
    renderTrend(results,t);
    renderTopics(dashData.topicAccuracy||{},t);
    renderExams(results,t);
    renderHistory(results,t);
}

// ===== STATS =====
function renderStats(stats,t){
    document.getElementById('statRow').innerHTML=
        '<div class="stat-card"><div class="stat-val">'+(stats.testsTaken||0)+'</div><div class="stat-lbl">'+t.tests+'</div></div>'+
        '<div class="stat-card"><div class="stat-val">'+(stats.avgAccuracy||0)+'%</div><div class="stat-lbl">'+t.avg+'</div></div>'+
        '<div class="stat-card"><div class="stat-val">'+(stats.bestScore||0)+'</div><div class="stat-lbl">'+t.best+'</div></div>'+
        '<div class="stat-card"><div class="stat-val">'+(stats.totalTime||'0h')+'</div><div class="stat-lbl">'+t.time+'</div></div>';
}

// ===== STREAK =====
function renderStreak(stats,t){
    var streak=stats.streak||0;
    var dayNames=t.day_names;
    var today=new Date().getDay();
    var adjustedToday=today===0?6:today-1;

    var html='<div class="streak-title">'+t.streak+' · '+streak+' days</div><div class="streak-row">';
    for(var i=0;i<7;i++){
        var cls='';
        if(i<adjustedToday)cls='streak-done';
        else if(i===adjustedToday)cls='streak-today';
        else cls='streak-miss';
        html+='<div class="streak-day '+cls+'"><span>'+dayNames[i]+'</span></div>';
    }
    html+='</div>';
    document.getElementById('streakCard').innerHTML=html;
}

// ===== TREND =====
function renderTrend(results,t){
    if(results.length<2){
        document.getElementById('trendCard').innerHTML='<div class="sec-t">'+t.trend+'</div><p style="text-align:center;padding:20px;font-size:13px;color:var(--text-light)">'+t.no_data+'</p>';
        return;
    }

    var scores=results.slice(0,10).reverse().map(function(r){return r.accuracy||Math.round((r.score||0)/(r.total||100)*100)});
    var maxS=100;
    var w=600,h=140,pad=30;
    var xStep=(w-pad)/(scores.length-1||1);

    var pathD='';
    var dots='';
    scores.forEach(function(s,i){
        var x=pad+i*xStep;
        var y=h-10-(s/maxS*(h-20));
        if(i===0)pathD+='M'+x+','+y;
        else pathD+=' L'+x+','+y;
        dots+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--primary)" stroke="#fff" stroke-width="2"/>';
    });

    var labels='';
    scores.forEach(function(s,i){
        var x=pad+i*xStep;
        labels+='<text x="'+x+'" y="'+(h+2)+'" text-anchor="middle" font-size="10" fill="var(--text-light)">T'+(i+1)+'</text>';
    });

    var html=
        '<div class="sec-t">'+t.trend+'<small>'+t.trend_sub+'</small></div>'+
        '<div class="trend-wrap"><svg class="trend-svg" viewBox="0 0 '+w+' '+(h+12)+'" preserveAspectRatio="xMidYMid meet">'+
            '<line x1="'+pad+'" y1="10" x2="'+pad+'" y2="'+h+'" stroke="var(--border-light)" stroke-width="1"/>'+
            '<line x1="'+pad+'" y1="'+h+'" x2="'+w+'" y2="'+h+'" stroke="var(--border-light)" stroke-width="1"/>'+
            '<text x="'+(pad-4)+'" y="14" text-anchor="end" font-size="9" fill="var(--text-light)">100</text>'+
            '<text x="'+(pad-4)+'" y="'+(h/2+4)+'" text-anchor="end" font-size="9" fill="var(--text-light)">50</text>'+
            '<text x="'+(pad-4)+'" y="'+(h+4)+'" text-anchor="end" font-size="9" fill="var(--text-light)">0</text>'+
            '<path d="'+pathD+'" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
            dots+labels+
        '</svg></div>';

    // Trend indicator
    if(scores.length>=2){
        var diff=scores[scores.length-1]-scores[0];
        var trendTxt=diff>0?'Improving (+'+diff+'%)':diff<0?'Declining ('+diff+'%)':'Stable';
        var trendColor=diff>0?'var(--green)':diff<0?'var(--primary)':'var(--text-light)';
        html+='<div style="text-align:center;font-size:12px;font-weight:600;color:'+trendColor+';margin-top:8px">'+trendTxt+'</div>';
    }

    document.getElementById('trendCard').innerHTML=html;
}

// ===== TOPICS =====
function renderTopics(topicAcc,t){
    var keys=Object.keys(topicAcc);
    if(keys.length===0){
        document.getElementById('topicCard').innerHTML='<div class="sec-t">'+t.topics+'</div><p style="text-align:center;padding:20px;font-size:13px;color:var(--text-light)">'+t.no_topics+'</p>';
        return;
    }

    var topics=keys.map(function(k){return{name:k,acc:topicAcc[k]}}).sort(function(a,b){return a.acc-b.acc});

    var html='<div class="sec-t">'+t.topics+'<small>'+t.focus+'</small></div><div class="topic-list">';
    topics.forEach(function(tp,i){
        var color=tp.acc>=70?'var(--green)':tp.acc>=50?'var(--orange)':'var(--primary)';
        var tagCls=tp.acc>=70?'tag-strong':tp.acc>=50?'tag-avg':'tag-weak';
        var tagTxt=tp.acc>=70?'Strong':tp.acc>=50?'Average':'Weak';

        html+=
            '<div class="topic-item">'+
                '<div class="topic-rank">'+(i+1)+'</div>'+
                '<div class="topic-info"><div class="topic-name">'+tp.name+'</div></div>'+
                '<div class="topic-bar-area"><div class="topic-bar"><div class="topic-fill" style="width:'+tp.acc+'%;background:'+color+'"></div></div></div>'+
                '<div class="topic-pct" style="color:'+color+'">'+tp.acc+'%</div>'+
                '<div class="topic-tag '+tagCls+'">'+tagTxt+'</div>'+
            '</div>';
    });
    html+='</div>';

    // Recommendations
    var weak=topics.filter(function(t){return t.acc<50}).slice(0,3);
    if(weak.length>0){
        html+='<div style="margin-top:14px;padding:12px;background:var(--primary-light);border-radius:var(--radius);font-size:12px"><strong>Focus on:</strong> '+weak.map(function(w){return w.name}).join(', ')+'</div>';
    }

    document.getElementById('topicCard').innerHTML=html;
}

// ===== EXAM SUMMARY =====
function renderExams(results,t){
    if(results.length===0){
        document.getElementById('examCard').innerHTML='<div class="sec-t">'+t.exams+'</div><div class="exam-empty">'+t.no_exams+'<br><button class="btn btn-p" style="margin-top:8px" onclick="location.href=\'dashboard.html\'">'+t.start+'</button></div>';
        return;
    }

    var examMap={};
    results.forEach(function(r){
        var ex=r.examId||'unknown';
        if(!examMap[ex])examMap[ex]={name:r.examName||ex,count:0,totalScore:0,best:0};
        examMap[ex].count++;
        examMap[ex].totalScore+=(r.accuracy||0);
        if((r.score||0)>examMap[ex].best)examMap[ex].best=(r.score||0);
    });

    var html='<div class="sec-t">'+t.exams+'</div><div class="exam-row">';
    Object.keys(examMap).forEach(function(ex){
        var e=examMap[ex];
        var avg=Math.round(e.totalScore/e.count);
        var color=avg>=70?'var(--green)':avg>=50?'var(--orange)':'var(--primary)';
        html+=
            '<div class="exam-item" onclick="location.href=\'exam.html?exam='+ex+'\'">'+
                '<div class="exam-left"><div class="exam-dot" style="background:'+color+'"></div><div><div class="exam-nm">'+e.name+'</div><div class="exam-ct">'+e.count+' tests</div></div></div>'+
                '<div class="exam-right"><div class="exam-sc" style="color:'+color+'">'+avg+'% avg</div><div class="exam-best">Best: '+e.best+'</div></div>'+
            '</div>';
    });
    html+='</div>';
    document.getElementById('examCard').innerHTML=html;
}

// ===== HISTORY =====
function renderHistory(results,t){
    if(results.length===0){
        document.getElementById('histCard').innerHTML='<div class="sec-t">'+t.history+'</div><div class="hist-empty">'+t.no_hist+'</div>';
        return;
    }

    var html='<div class="sec-t">'+t.history+'</div><div class="hist-list">';
    results.slice(0,20).forEach(function(r){
        var acc=r.accuracy||0;
        var color=acc>=70?'var(--green)':acc>=50?'var(--orange)':'var(--primary)';
        var dateStr='';
        if(r.submittedAt){
            var d=new Date(r.submittedAt);
            dateStr=d.getDate()+' '+(d.toLocaleString('en',{month:'short'}));
        }

        html+=
            '<div class="hist-item" onclick="location.href=\'result.html?id='+r.resultId+'\'">'+
                '<div class="hist-left"><div class="hist-dot" style="background:'+color+'"></div><div class="hist-info"><div class="hist-exam">'+(r.examName||r.examId||'')+'</div><div class="hist-paper">'+(r.paperId||'')+'</div></div></div>'+
                '<div class="hist-right"><div class="hist-score" style="color:'+color+'">'+(r.score||0)+'/'+(r.total||100)+'</div><div class="hist-date">'+dateStr+'</div></div>'+
            '</div>';
    });
    html+='</div>';
    document.getElementById('histCard').innerHTML=html;
}

// ===== INIT =====
loadData();
</script>
</body>
</html>
